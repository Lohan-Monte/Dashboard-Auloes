<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Responsáveis • Agenda de Aulões UpSeller</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="brand">
      UpSeller
      <span class="brand-sub">Agenda de Aulões</span>
    </div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="responsaveis.html" class="active">Responsáveis</a>
    </div>
  </div>
  <div class="topbar-right">
    <div class="user-chip">
      <span class="avatar-dot" id="avatarDot">--</span>
      <span id="userEmail">carregando...</span>
    </div>
    <button class="logout-btn" id="logoutBtn">Sair</button>
  </div>
</div>

<div class="page">
  <div class="page-header">
    <div>
      <h1>Responsáveis</h1>
      <p>Adicione ou remova quem pode ser escalado para apresentar os aulões.</p>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Adicionar responsável</div>
    <form class="add-form" id="addForm">
      <div class="field">
        <label for="nomeInput">Nome</label>
        <input type="text" id="nomeInput" placeholder="Ex.: Lohan" required />
      </div>
      <div class="field" style="flex:0 0 90px; min-width:90px;">
        <label for="corInput">Cor</label>
        <input type="color" id="corInput" value="#1A56DB" style="padding:2px; height:38px; cursor:pointer;" />
      </div>
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>
  </div>

  <div style="height:20px;"></div>

  <div class="card">
    <div class="card-header">Equipe atual</div>
    <div id="listaAnalistas">
      <div class="empty-state">Carregando...</div>
    </div>
  </div>
</div>

<script src="supabase-client.js"></script>
<script src="responsaveis.js"></script>

</body>
</html>
