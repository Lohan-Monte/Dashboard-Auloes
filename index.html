<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login • Agenda de Aulões UpSeller</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span style="font-size:22px; font-weight:800; color:#1A56DB; letter-spacing:.2px;">UpSeller</span>
      <h1>Agenda de Aulões</h1>
      <p>Acesso restrito à equipe de implementação UpSeller</p>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seunome@upseller.com" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="loginBtn">
        Entrar
      </button>
    </form>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
  // Se já estiver logado, vai direto pro dashboard
  (async () => {
    try {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        mostrarErroFatal("Erro ao verificar sessão no Supabase: " + error.message);
        return;
      }
      if (data.session && podeRedirecionar()) {
        window.location.href = "dashboard.html";
      }
    } catch (e) {
      mostrarErroFatal("Erro inesperado ao carregar o login: " + e.message);
    }
  })();

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Entrando...";

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    try {
      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password: senha,
      });

      if (error) {
        errorBox.textContent = "E-mail ou senha inválidos, ou erro de conexão: " + error.message;
        errorBox.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Entrar";
        return;
      }

      window.location.href = "dashboard.html";
    } catch (e) {
      errorBox.textContent = "Erro inesperado ao tentar entrar: " + e.message;
      errorBox.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });
</script>

</body>
</html>
