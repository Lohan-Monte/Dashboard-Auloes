<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recuperar senha • Agenda de Aulões UpSeller</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span style="font-size:22px; font-weight:800; color:#1A56DB; letter-spacing:.2px;">UpSeller</span>
      <h1>Recuperar senha</h1>
      <p>Informe seu e-mail e enviaremos um link para você criar uma nova senha.</p>
    </div>

    <div id="msgErro" class="login-error"></div>
    <div id="msgSucesso" class="login-success"></div>

    <form id="recuperarForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seunome@upseller.com" required autocomplete="username" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="enviarBtn">
        Enviar link de recuperação
      </button>
      <div style="text-align:center; margin-top:16px;">
        <a href="index.html" style="font-size:13px; color:var(--text-muted); text-decoration:none;">← Voltar para o login</a>
      </div>
    </form>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
  const form = document.getElementById("recuperarForm");
  const errorBox = document.getElementById("msgErro");
  const successBox = document.getElementById("msgSucesso");
  const btn = document.getElementById("enviarBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    successBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Enviando...";

    const email = document.getElementById("email").value.trim();

    // URL para onde o Supabase deve redirecionar depois que o usuário clicar
    // no link do e-mail. IMPORTANTE: essa URL precisa estar cadastrada em
    // Supabase > Authentication > URL Configuration > Redirect URLs.
    const redirectTo = new URL("redefinir-senha.html", window.location.href).href;

    try {
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo,
      });

      if (error) {
        errorBox.textContent = "Não foi possível enviar o link: " + error.message;
        errorBox.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Enviar link de recuperação";
        return;
      }

      successBox.textContent = "Se esse e-mail estiver cadastrado, enviamos um link de recuperação. Confira sua caixa de entrada (e o spam).";
      successBox.classList.add("show");
      form.querySelector('input[type="email"]').value = "";
      btn.textContent = "Link enviado";
    } catch (e) {
      errorBox.textContent = "Erro inesperado ao enviar o link: " + e.message;
      errorBox.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Enviar link de recuperação";
    }
  });
</script>

</body>
</html>
